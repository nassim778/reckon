<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reckon — Calculator</title>
  <meta name="google-adsense-account" content="ca-pub-7453582142608864">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1e24;
    --surface:#25272f;
    --display:#14151a;
    --accent:#f2a900;
    --accent-dim:#c98c00;
    --text:#eae7e0;
    --text-dim:#8b8d97;
    --display-text:#eae7e0;
    --display-text-dim:#a6a8b0;
    --op-bg:#2f323c;
    --danger:#e8555a;
    --ad-border: rgba(234,231,224,0.18);
    box-sizing:border-box;
  }
  *{box-sizing:inherit; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    padding-left:16px;
    padding-right:16px;
    padding-top:calc(env(safe-area-inset-top,0px) + 24px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eeece6;
      --surface:#ffffff;
      --display:#1c1e24;
      --text:#1c1e24;
      --text-dim:#6b6d76;
      --op-bg:#e2e0d8;
      --ad-border: rgba(28,30,36,0.18);
    }
  }
  header{
    text-align:center;
  }
  header h1{
    font-size:1.15rem;
    font-weight:700;
    letter-spacing:0.02em;
  }
  header p{
    font-size:0.8rem;
    color:var(--text-dim);
    margin-top:4px;
  }

  /* --- Ad slot styling: swap the inner placeholder div for your AdSense <ins> unit --- */
  .ad-slot{
    width:100%;
    max-width:360px;
    border:1px dashed var(--ad-border);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-size:0.7rem;
    letter-spacing:0.03em;
    text-align:center;
    padding:10px;
  }
  .ad-slot.top{ min-height:60px; }
  .ad-slot.bottom{ min-height:90px; }

  .calc{
    width:100%;
    max-width:360px;
    background:var(--surface);
    border-radius:22px;
    padding:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
  }
  .display{
    background:var(--display);
    border-radius:14px;
    padding:22px 18px 18px;
    margin-bottom:16px;
    min-height:112px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-align:right;
    overflow:hidden;
  }
  .display .prev{
    font-family:'JetBrains Mono', monospace;
    font-size:0.9rem;
    color:var(--display-text-dim);
    min-height:1.2em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .display .curr{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    font-size:clamp(1.35rem, 7vw, 2rem);
    line-height:1.25;
    font-variant-numeric:tabular-nums;
    color:var(--display-text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  button{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.15rem;
    font-weight:500;
    border:none;
    border-radius:14px;
    padding:16px 0;
    background:var(--op-bg);
    color:var(--text);
    cursor:pointer;
    transition:transform 0.05s ease, filter 0.15s ease;
  }
  button:active{ transform:scale(0.96); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button.op{ background:transparent; color:var(--accent); font-weight:700; }
  button.op:hover{ filter:brightness(1.15); }
  button.equals{
    background:var(--accent);
    color:#1c1e24;
    font-weight:700;
  }
  button.equals:hover{ filter:brightness(1.08); }
  button.clear{ color:var(--danger); background:transparent; font-weight:700;}
  button.span2{ grid-column:span 2; }

  footer{
    color:var(--text-dim);
    font-size:0.72rem;
    text-align:center;
    max-width:360px;
  }
</style>
</head>
<body>

  <header>
    <h1>Reckon</h1>
    <p>A calculator, kept simple.</p>
  </header>

  <!-- AD SLOT: top banner (e.g. 320x50 or responsive AdSense unit) -->
  <div class="ad-slot top" id="ad-top">Ad space — top banner</div>

  <div class="calc">
    <div class="display">
      <div class="prev" id="prev"></div>
      <div class="curr" id="curr">0</div>
    </div>
    <div class="pad">
      <button class="clear" data-action="clear">AC</button>
      <button class="op" data-action="sign">±</button>
      <button class="op" data-action="percent">%</button>
      <button class="op" data-action="divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-action="multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-action="subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-action="add">+</button>

      <button class="span2" data-digit="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <!-- AD SLOT: bottom / in-feed unit -->
  <div class="ad-slot bottom" id="ad-bottom">Ad space — bottom unit</div>

  <footer>Replace the dashed boxes above with your AdSense ad units once your site is approved.</footer>

<script>
(function(){
  const prevEl = document.getElementById('prev');
  const currEl = document.getElementById('curr');

  let curr = '0';
  let prev = null;
  let op = null;
  let resetNext = false;

  function fmt(n){
    if (n === 'Error') return n;
    const num = parseFloat(n);
    if (Number.isNaN(num)) return '0';
    return num.toString().length > 12 ? num.toPrecision(10).replace(/\.?0+$/,'') : n;
  }

  function render(){
    currEl.textContent = fmt(curr);
    prevEl.textContent = prev !== null && op ? `${fmt(prev)} ${op}` : '';
  }

  function inputDigit(d){
    if (resetNext || curr === '0'){ curr = d; resetNext = false; }
    else if (curr.length < 14){ curr += d; }
  }

  function inputDecimal(){
    if (resetNext){ curr = '0.'; resetNext = false; return; }
    if (!curr.includes('.')) curr += '.';
  }

  function setOp(symbol){
    if (op !== null && !resetNext) compute();
    prev = curr;
    op = symbol;
    resetNext = true;
  }

  function compute(){
    if (op === null || prev === null) return;
    const a = parseFloat(prev), b = parseFloat(curr);
    let r;
    try{
      switch(op){
        case '+': r = a + b; break;
        case '−': r = a - b; break;
        case '×': r = a * b; break;
        case '÷': r = b === 0 ? NaN : a / b; break;
        default: return;
      }
    } catch(e){ r = NaN; }
    curr = Number.isNaN(r) ? 'Error' : String(r);
    op = null; prev = null; resetNext = true;
  }

  function handle(action){
    switch(action){
      case 'clear': curr='0'; prev=null; op=null; resetNext=false; break;
      case 'sign': if (curr !== '0' && curr !== 'Error') curr = curr.startsWith('-') ? curr.slice(1) : '-' + curr; break;
      case 'percent': curr = String(parseFloat(curr) / 100); break;
      case 'decimal': inputDecimal(); break;
      case 'add': setOp('+'); break;
      case 'subtract': setOp('−'); break;
      case 'multiply': setOp('×'); break;
      case 'divide': setOp('÷'); break;
      case 'equals': compute(); break;
    }
    render();
  }

  document.querySelectorAll('button[data-digit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ inputDigit(btn.dataset.digit); render(); });
  });
  document.querySelectorAll('button[data-action]').forEach(btn=>{
    btn.addEventListener('click', ()=> handle(btn.dataset.action));
  });

  window.addEventListener('keydown', (e)=>{
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDecimal();
    else if (e.key === '+') setOp('+');
    else if (e.key === '-') setOp('−');
    else if (e.key === '*') setOp('×');
    else if (e.key === '/') setOp('÷');
    else if (e.key === 'Enter' || e.key === '=') compute();
    else if (e.key === 'Escape') handle('clear');
    else return;
    render();
  });

  render();
})();
</script>
</body>
</html>
