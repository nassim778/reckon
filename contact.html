<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact the Reckon project with questions, feedback, or accessibility concerns.">
  <title>Contact Reckon</title>
  <style>
    :root{color-scheme:dark;--bg:#1c1e24;--text:#eae7e0;--muted:#b2b4bc;--accent:#f2a900}
    *{box-sizing:border-box}
    body{margin:0;padding:32px 18px;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}
    main{max-width:720px;margin:0 auto}
    nav{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:28px}
    a{color:var(--accent)}
    h1{line-height:1.2}
    p{color:var(--muted)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    @media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#eeece6;--text:#1c1e24;--muted:#6b6d76}}
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation">
      <a href="index.html">Calculator</a>
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy policy</a>
    </nav>
    <h1>Contact Reckon</h1>
    <p>Have a question, suggestion, accessibility concern, or issue with the calculator? Please open a topic on the <a href="https://github.com/nassim778/reckon/issues">Reckon project feedback page</a>. Do not include private or sensitive information in a public report.</p>
  </main>
</body>
</html>
